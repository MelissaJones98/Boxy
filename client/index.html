<!doctype html>
<!--
  client/index.html — the single HTML page the whole React app lives in.
  Vite serves it in development and uses it as the entry point for the build.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mobile-first: render at the phone's real width instead of a zoomed-out desktop page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxy</title>
  </head>
  <body>
    <!-- React renders everything inside this div (see src/main.jsx). -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
